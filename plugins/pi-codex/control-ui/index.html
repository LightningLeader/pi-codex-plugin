<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Pi Control Center</title>
    <link rel="stylesheet" href="/styles.css?v=layout-8" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL RPC OBSERVATORY</p>
        <h1>Pi Control Center</h1>
      </div>
      <div class="top-actions">
        <span id="connection" class="status-chip offline">正在连接</span>
        <button id="new-session" class="primary">新建会话</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="会话">
        <section>
          <div class="section-heading">
            <h2>会话</h2>
            <div class="section-heading-actions">
              <span id="session-count">0</span>
              <button id="refresh" class="icon-button" title="刷新">↻</button>
            </div>
          </div>
          <div id="session-list" class="item-list"></div>
        </section>
      </aside>

      <section class="workspace">
        <div id="empty-state" class="empty-state">
          <div class="pi-mark">π</div>
          <h2>选择或创建一个 Pi 会话</h2>
          <p>实时查看文本、thinking、工具调用和终端输出，并可随时 steer、追加任务或中断。</p>
        </div>

        <div id="session-view" class="session-view hidden">
          <header class="session-header">
            <div>
              <div class="title-row">
                <h2 id="session-title"></h2>
                <span id="session-status" class="status-chip"></span>
              </div>
              <p id="session-meta" class="muted"></p>
            </div>
            <div class="session-actions">
              <label class="collapse-control">
                <input id="collapse-mode" type="checkbox" />
                全部折叠
              </label>
              <button id="reload-history">重载历史</button>
              <button id="abort-session" class="danger" title="中断当前正在执行的一轮任务；Pi RPC 进程和会话会保留，之后仍可继续发送消息。">中断</button>
              <button id="terminate-session" class="danger" title="结束该会话的 Pi RPC 进程并取消当前任务；会话记录会保留，但不能继续对话。">结束进程</button>
              <button id="delete-session" class="danger" title="停止 Pi RPC 进程并从控制中心删除该会话；此操作不可恢复。">删除会话</button>
            </div>
          </header>

          <section class="history-panel" aria-label="会话历史">
            <div class="history-toolbar">
              <span>消息记录</span>
              <button id="jump-latest" type="button" class="jump-latest hidden">↓ 回到最新</button>
            </div>
            <div id="pending-ui" class="pending-ui hidden"></div>
            <div id="event-stream" class="event-stream" aria-live="polite"></div>
          </section>

          <form id="composer" class="composer">
            <textarea id="message-input" rows="3" placeholder="输入发送给 Pi 的内容。Ctrl/Cmd + Enter 发送。"></textarea>
            <div class="composer-actions">
              <select id="message-mode" aria-label="消息发送模式">
                <option value="prompt">普通消息</option>
                <option value="steer">Steer：当前工具结束后转向</option>
                <option value="follow-up">Follow-up：当前任务完成后继续</option>
              </select>
              <button type="submit" class="primary">发送</button>
            </div>
          </form>
        </div>

        <div id="job-view" class="session-view hidden">
          <header class="session-header">
            <div>
              <div class="title-row">
                <h2 id="job-title"></h2>
                <span id="job-status" class="status-chip"></span>
              </div>
              <p id="job-meta" class="muted"></p>
            </div>
            <button id="delete-job" class="danger">删除任务</button>
          </header>
          <section class="history-panel job-history-panel" aria-label="只读会话记录">
            <div class="history-toolbar">
              <span>只读会话记录</span>
              <span id="job-history-note">正在加载…</span>
            </div>
            <div id="job-history" class="event-stream"></div>
          </section>
          <details class="legacy-log-panel">
            <summary>原始任务日志（诊断）</summary>
            <pre id="job-log" class="legacy-log"></pre>
          </details>
        </div>
      </section>
    </main>

    <dialog id="new-session-dialog">
      <form id="new-session-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">NEW RPC SESSION</p>
            <h2>新建 Pi 会话</h2>
          </div>
          <button type="button" id="close-dialog" class="icon-button">×</button>
        </div>
        <label>名称<input name="name" placeholder="例如：修复登录测试" /></label>
        <label>工作目录<input name="cwd" id="session-cwd" required /><small>目录不存在时会自动创建。</small></label>
        <label>模型（可选）<input name="model" placeholder="provider/model" /></label>
        <label>Thinking level
          <select name="effort">
            <option value="">使用 Pi 默认值</option>
            <option>off</option><option>minimal</option><option>low</option><option>medium</option>
            <option>high</option><option>xhigh</option><option>max</option>
          </select>
        </label>
        <label>初始任务<textarea name="prompt" rows="6" required></textarea></label>
        <label class="toggle"><input name="readOnly" type="checkbox" /> 只读会话（禁用写入工具）</label>
        <p id="dialog-error" class="error-text"></p>
        <div class="dialog-actions">
          <button type="button" id="cancel-dialog">取消</button>
          <button type="submit" class="primary">启动会话</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
